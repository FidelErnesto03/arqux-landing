<rect class="stage-frame" x="-95.0" y="-67.5" width="190" height="135" rx="21"/>
<g class="stage-icon" transform="translate(0,-27) scale(.72)"><rect x="-26" y="-23" width="52" height="46" rx="5"/><path d="M-15 -7 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0 M-20 11 Q-8 0 4 11 M10 -9 H19 M10 0 H19 M10 9 H19"/></g>
<text class="stage-title" x="0" y="20" text-anchor="middle">Identity</text>
<text class="stage-desc" x="0" y="45" text-anchor="middle">Who acts</text>
</g>
<g id="arqx-stage-contrato" class="arqx-stage" role="button" tabindex="0" transform="translate(520,384)" data-stage="contrato" aria-label="Contract: What it can do">
<rect class="pulse" x="-104.0" y="-76.5" width="208" height="153" rx="24" fill="#59FCE2" filter="url(#glow)"/>
<rect class="stage-frame" x="-95.0" y="-67.5" width="190" height="135" rx="21"/>
<g class="stage-icon" transform="translate(0,-27) scale(.72)"><path d="M-20 -26 H9 L22 -13 V25 H-20 Z M9 -26 V-13 H22 M-11 -3 H11 M-11 6 H8 M-10 16 H-2"/><circle cx="18" cy="17" r="12" fill="#0C2530"/><path d="M12 17 L16 21 L24 12"/></g>
<text class="stage-title" x="0" y="20" text-anchor="middle">Contract</text>
<text class="stage-desc" x="0" y="45" text-anchor="middle">What it can do</text>
</g>
<g id="arqx-stage-contexto" class="arqx-stage" role="button" tabindex="0" transform="translate(520,554)" data-stage="contexto" aria-label="Context: What it works with">
<rect class="pulse" x="-104.0" y="-76.5" width="208" height="153" rx="24" fill="#59FCE2" filter="url(#glow)"/>
<rect class="stage-frame" x="-95.0" y="-67.5" width="190" height="135" rx="21"/>
<g class="stage-icon" transform="translate(0,-27) scale(.72)"><path d="M0 -25 L29 -10 L0 5 L-29 -10 Z M-29 1 L0 16 L29 1 M-29 13 L0 28 L29 13"/></g>
<text class="stage-title" x="0" y="20" text-anchor="middle">Context</text>
<text class="stage-desc" x="0" y="45" text-anchor="middle">What it works with</text>
</g>

