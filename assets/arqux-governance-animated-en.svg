<rect class="stage-frame" x="-95.0" y="-67.5" width="190" height="135" rx="21"/>
<g class="stage-icon" transform="translate(0,-27) scale(.72)"><circle cx="0" cy="-24" r="5"/><circle cx="-24" cy="21" r="5"/><circle cx="24" cy="21" r="5"/><path d="M0 -19 V-6 L-24 12 M0 -6 L24 12"/></g>
<text class="stage-title" x="0" y="20" text-anchor="middle">Decision</text>
<text class="stage-desc" x="0" y="45" text-anchor="middle">What is agreed</text>
</g>
<g id="arqx-stage-ejecucion" class="arqx-stage" role="button" tabindex="0" transform="translate(1080,384)" data-stage="ejecucion" aria-label="Execution: How it is done">
<rect class="pulse" x="-104.0" y="-76.5" width="208" height="153" rx="24" fill="#59FCE2" filter="url(#glow)"/>
<rect class="stage-frame" x="-95.0" y="-67.5" width="190" height="135" rx="21"/>
<g class="stage-icon" transform="translate(0,-27) scale(.72)"><circle cx="0" cy="0" r="15"/><path d="M-5 -28 H5 L8 -20 L17 -15 L25 -18 L31 -8 L25 -1 L25 8 L31 16 L24 25 L15 22 L7 27 L5 34 H-5 L-8 26 L-17 21 L-25 24 L-31 15 L-25 8 L-25 -1 L-31 -9 L-25 -18 L-16 -15 L-8 -20 Z" transform="scale(.86)"/></g>
<text class="stage-title" x="0" y="20" text-anchor="middle">Execution</text>
<text class="stage-desc" x="0" y="45" text-anchor="middle">How it is done</text>
</g>
<g id="arqx-stage-evidencia" class="arqx-stage" role="button" tabindex="0" transform="translate(1080,554)" data-stage="evidencia" aria-label="Evidence: What is checked">
<rect class="pulse" x="-104.0" y="-76.5" width="208" height="153" rx="24" fill="#59FCE2" filter="url(#glow)"/>
<rect class="stage-frame" x="-95.0" y="-67.5" width="190" height="135" rx="21"/>
<g class="stage-icon" transform="translate(0,-27) scale(.72)"><path d="M-19 -26 H9 L22 -13 V26 H-19 Z M9 -26 V-13 H22 M-10 -5 H9 M-10 4 H4"/><circle cx="15" cy="16" r="12" fill="#0D2731"/><path d="M8 16 L13 21 L22 11"/></g>
<text class="stage-title" x="0" y="20" text-anchor="middle">Evidence</text>
<text class="stage-desc" x="0" y="45" text-anchor="middle">What is checked</text>
</g>
<g id="arqx-core">
<circle cx="800" cy="420" r="124" fill="#020E17" stroke="#F4AA39" stroke-width="2.5"/>
<circle cx="800" cy="420" r="124" fill="none" stroke="#F6B03C" stroke-width="14" filter="url(#softglow)" opacity=".30"/>
<circle cx="800" cy="420" r="116" fill="none" stroke="#387C82" stroke-width="1" opacity=".7"/>
<g transform="translate(800 375) scale(.105) translate(-768 -500)">
