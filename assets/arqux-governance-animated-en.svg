<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 980" width="1600" height="980" role="group" aria-labelledby="arqx-title arqx-desc">
<title id="arqx-title">ArqUX: governance of work between agents and projects</title>
<desc id="arqx-desc">HARNESS connects to ArqUX, the governance center that organizes Identity, Contract, Context, Decision, Execution and Evidence. The project stays outside the circle. A clockwise halo represents governed learning, subject to review, with each dimension lighting up as it passes.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1721"/><stop offset="1" stop-color="#08121B"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 H0 V48" fill="none" stroke="#2C4653" stroke-width=".8" opacity=".24"/></pattern>
<radialGradient id="ambient"><stop stop-color="#165C63" stop-opacity=".22"/><stop offset="1" stop-color="#165C63" stop-opacity="0"/></radialGradient>
<linearGradient id="ring" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#2CEAD6"/><stop offset=".47" stop-color="#62EED4"/><stop offset=".68" stop-color="#FFD467"/><stop offset="1" stop-color="#F8A123"/></linearGradient>
<linearGradient id="surface" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17303B" stop-opacity=".95"/><stop offset="1" stop-color="#0A1923" stop-opacity=".98"/></linearGradient>
<linearGradient id="tealBorder" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4CEEDF"/><stop offset="1" stop-color="#23748C"/></linearGradient>
<linearGradient id="amberBorder" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE09A"/><stop offset="1" stop-color="#C67B14"/></linearGradient>
<filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="softglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="17"/></filter>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".50"/></filter>
<marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#56EADD" stroke-width="1.2"/></marker>
<marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#FFC05B" stroke-width="1.2"/></marker>
<path id="orbit-text" d="M 492,238 A 355,355 0 0 1 1108,238"/>
</defs>
<style><![CDATA[
:root{color-scheme:dark}text{font-family:Inter,'IBM Plex Sans','Segoe UI',Arial,sans-serif;fill:#F3F7F7}.muted{fill:#B7CAD1}.mono{font-family:'IBM Plex Mono',Consolas,monospace}.tiny{font-size:13px}.title{font-weight:750;font-size:25px}.desc{font-size:16px}.stage-title{font-size:22px;font-weight:760}.stage-desc{font-size:14px;fill:#CFDFE2}.stage-frame{fill:url(#surface);stroke:#427E86;stroke-width:1.5;transition:stroke .35s,filter .35s}.stage-icon{fill:none;stroke:#7EF3EA;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.arqx-stage{transform-box:fill-box;transform-origin:center;outline:none;cursor:pointer;opacity:0;animation:gov-in .55s ease forwards}
#arqx-stage-identidad{animation-delay:.78s}#arqx-stage-contrato{animation-delay:.9s}#arqx-stage-contexto{animation-delay:1.02s}#arqx-stage-decision{animation-delay:.84s}#arqx-stage-ejecucion{animation-delay:.96s}#arqx-stage-evidencia{animation-delay:1.08s}
.gov-outcome{opacity:0;animation:gov-in .55s ease 1.25s forwards}
#external-harness{opacity:0;animation:gov-in .55s ease .45s forwards}#external-project{opacity:0;animation:gov-in .55s ease .55s forwards}#connections{opacity:0;animation:gov-in .45s ease .7s forwards}.arqx-stage:focus .stage-frame,.arqx-stage:hover .stage-frame{stroke:#FFE4A2;filter:url(#glow)}.arqx-stage:focus .stage-title,.arqx-stage:hover .stage-title{fill:#FFE6A8}.arqx-stage:focus-visible{outline:3px solid #FFB547;outline-offset:6px}
.orbit-dash{transform-origin:800px 420px;animation:orbit 22s linear infinite}.learning-dot{transform-origin:800px 420px;animation:orbit 22s linear infinite}.arqx-stage .pulse{opacity:0;animation:brighten 22s ease-in-out infinite}#arqx-stage-identidad .pulse{animation-delay:0s}#arqx-stage-contrato .pulse{animation-delay:-18.3s}#arqx-stage-contexto .pulse{animation-delay:-14.6s}#arqx-stage-decision .pulse{animation-delay:-11s}#arqx-stage-ejecucion .pulse{animation-delay:-7.3s}#arqx-stage-evidencia .pulse{animation-delay:-3.6s}
@keyframes gov-in{from{opacity:0}to{opacity:1}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes brighten{0%,12%,100%{opacity:0}5%{opacity:.62}}
@media(prefers-reduced-motion:reduce){.orbit-dash,.learning-dot,.arqx-stage .pulse,.arqx-stage,.gov-outcome,#external-harness,#external-project,#connections{animation:none!important;opacity:1!important}.stage-frame{transition:none!important}}
]]></style>
<rect width="1600" height="980" fill="url(#bg)"/><rect width="1600" height="980" fill="url(#grid)"/>
<ellipse cx="795" cy="430" rx="620" ry="470" fill="url(#ambient)"/>
<!-- Learning ring: outer border, clockwise running highlight, event positions. -->
<circle cx="800" cy="420" r="335" fill="none" stroke="#16464D" stroke-width="22" opacity=".42"/>
<circle cx="800" cy="420" r="335" fill="none" stroke="url(#ring)" stroke-width="4"/>
<circle cx="800" cy="420" r="319" fill="none" stroke="#5CE6DB" stroke-width="1" stroke-dasharray="3 7" opacity=".65"/>
<g class="orbit-dash" id="arqx-learning-orbit" aria-hidden="true"><circle cx="800" cy="420" r="335" fill="none" stroke="#FFE195" stroke-width="15" stroke-linecap="round" stroke-dasharray="42 2063" opacity=".80" filter="url(#glow)"/><circle cx="800" cy="420" r="335" fill="none" stroke="#FFF0C0" stroke-width="4" stroke-linecap="round" stroke-dasharray="42 2063"/></g>
<g class="learning-dot" aria-hidden="true"><circle cx="800" cy="85" r="12" fill="#FFCF6F" opacity=".8" filter="url(#glow)"/><circle cx="800" cy="85" r="6" fill="#FFF3CE"/></g>
<text class="mono" font-size="21" font-weight="700" letter-spacing="4" fill="#E6F7F3"><textPath xlink:href="#orbit-text" startOffset="50%" text-anchor="middle">GOVERNED LEARNING</textPath></text>

<g id="connections" fill="none" stroke-width="3" stroke-linecap="round">
<path d="M294 420 H442" stroke="#57EBDD" marker-end="url(#arrow-teal)"/><path d="M442 440 H294" stroke="#57EBDD" marker-end="url(#arrow-teal)"/>
<path d="M1158 420 H1306" stroke="#57EBDD" marker-end="url(#arrow-teal)"/><path d="M1306 440 H1158" stroke="#57EBDD" marker-end="url(#arrow-teal)"/>
</g>
