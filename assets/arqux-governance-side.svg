<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 618" width="1000" height="618" role="group" aria-labelledby="arqx-title arqx-desc">
<title id="arqx-title">ArqUX: gobierno del trabajo entre agentes y proyectos</title>
<desc id="arqx-desc">HARNESS, ArqUX y PROJECT en un mapa lateral. La órbita ámbar circula alrededor de la marca ArqUX, dibujando el anillo de aprendizaje en una vuelta y borrándolo en la siguiente; la marca pulsa cada vez que la órbita pasa por la parte superior. Las seis dimensiones de gobierno se detallan más abajo en la página.</desc>
<defs>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 H0 V48" fill="none" stroke="#0A1420" stroke-width=".8" opacity=".09"/></pattern>
<filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="softglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="17"/></filter>
</defs>
<style><![CDATA[
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url("/assets/fonts/ibm-plex-sans-400.woff2") format("woff2")}@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:500;font-display:swap;src:url("/assets/fonts/ibm-plex-sans-500.woff2") format("woff2")}@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url("/assets/fonts/ibm-plex-sans-600.woff2") format("woff2")}@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:700;font-display:swap;src:url("/assets/fonts/ibm-plex-sans-700.woff2") format("woff2")}
text{font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;fill:#0A1420}.muted{fill:#596772}.mono{font-family:'IBM Plex Mono',Consolas,monospace}


.orbit-dash{transform-origin:500px 266px}#arqx-core{transform-box:fill-box;transform-origin:center}#arqx-core.is-beat{animation:core-beat .8s ease-out}@keyframes core-beat{0%{transform:scale(1)}18%{transform:scale(1.08)}38%{transform:scale(1.02)}58%{transform:scale(1.07)}100%{transform:scale(1)}}
.rail-title{font-size:23px;font-weight:780;fill:#0A1420}.rail-icon{pointer-events:none}.rail-sub{font-size:16px;fill:#596772}.rail-arrow{font-size:22px;fill:#D77A00;font-weight:700}



.triad-node{cursor:pointer;outline:none}.triad-hit{fill:transparent;pointer-events:all}.triad-node:hover .rail-title,.triad-node:focus .rail-title{fill:#8A4B00}.triad-node:hover .rail-icon,.triad-node:focus .rail-icon{filter:url(#glow)}.triad-node:focus-visible .triad-hit{stroke:#D77A00;stroke-width:2}.triad-detail{opacity:0;visibility:hidden;pointer-events:none}#triad-lift-layer{pointer-events:none}.triad-inner{transform-box:fill-box;transform-origin:center;transform:scale(.88) translateY(10px);opacity:0;transition:opacity .16s ease,transform .22s cubic-bezier(.2,.7,.2,1),visibility .16s}.triad-detail.is-on{opacity:1;visibility:visible}.triad-detail.is-on .triad-inner{opacity:1;transform:scale(1) translateY(-6px)}.triad-frame{fill:rgba(247,242,232,.95);stroke:#D77A00;stroke-width:2;filter:drop-shadow(0 18px 24px rgba(10,20,32,.14))}.triad-title{font-size:21px;font-weight:780;fill:#8A4B00}.triad-desc{font-size:19px;font-weight:500;fill:#22394A}.triad-detail .rail-icon{fill:none;stroke:#167A55;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.orbit-dash{display:none!important}.build-ring{opacity:1!important}.triad-inner{transition:none!important}}}]]></style>
<rect width="1000" height="618" fill="url(#grid)"/>

<g id="ecosystem-rail" aria-label="HARNESS to ArqUX to PROYECTO">
<line x1="40" y1="520" x2="960" y2="520" stroke="rgba(10,20,32,.22)" stroke-width="1.5"/>
<g class="triad-node" data-triad="harness" data-target="/es/referencia/#workflow" role="link" tabindex="0" aria-label="Harness: continuidad. Abrir el flujo de trabajo." aria-describedby="triad-desc-harness">
<desc id="triad-desc-harness">Agentes de IA que ejecutan, orquestan y extienden el trabajo. El contexto sobrevive: no empiezas de cero.</desc>
<rect class="triad-hit" x="20" y="468" width="300" height="132" rx="18" fill="transparent"/>
<g class="rail-icon" aria-hidden="true" transform="translate(64 488) scale(.5)" fill="none" stroke="#167A55" stroke-width="3"><rect x="-35" y="-21" width="70" height="57" rx="23" fill="#EAF2EF"/><path d="M0 -33 V-21 M-48 0 H-36 M36 0 H48"/><circle cx="-13" cy="3" r="5" fill="#167A55" stroke="none"/><circle cx="13" cy="3" r="5" fill="#167A55" stroke="none"/><path d="M-12 19 Q0 26 12 19"/></g>
<text class="rail-title" x="40" y="552">HARNESS</text><text class="rail-sub" x="40" y="574">Agentes de IA · continuidad</text>
</g>
<text class="rail-arrow" x="330" y="555">→</text>
<g class="triad-node" data-triad="arqx" data-target="/es/referencia/#dimensions" role="link" tabindex="0" aria-label="ArqUX: gobierno y trazabilidad. Abrir las dimensiones." aria-describedby="triad-desc-arqx">
<desc id="triad-desc-arqx">Seis dimensiones de gobierno: identidad, contrato, contexto, decisión, ejecución y evidencia. El aprendizaje se revisa.</desc>
<rect class="triad-hit" x="340" y="468" width="300" height="132" rx="18" fill="transparent"/>
<path d="M500 476 L511 482.5 V495.5 L500 502 L489 495.5 V482.5 Z" fill="none" stroke="#D77A00" stroke-width="2" aria-hidden="true"/>
<text class="rail-title" x="500" y="552" text-anchor="middle">ArqUX</text><text class="rail-sub" x="500" y="574" text-anchor="middle">Gobierno · trazabilidad</text>
</g>
<text class="rail-arrow" x="670" y="555">→</text>
<g class="triad-node" data-triad="project" data-target="/es/referencia/#artifacts" role="link" tabindex="0" aria-label="Proyecto: portabilidad. Abrir los artefactos." aria-describedby="triad-desc-project">
<desc id="triad-desc-project">Tu entorno real: código, datos y resultados. El contexto puede viajar entre apps compatibles.</desc>
<rect class="triad-hit" x="680" y="468" width="300" height="132" rx="18" fill="transparent"/>
<g class="rail-icon" aria-hidden="true" transform="translate(936 488) scale(.5)" fill="none" stroke="#167A55" stroke-width="3"><path d="M0 -22 L29 -8 V18 L0 34 L-29 18 V-8 Z M0 -22 V6 M-29 -8 L0 6 L29 -8 M0 6 V34"/></g>
<text class="rail-title" x="960" y="552" text-anchor="end">PROYECTO</text><text class="rail-sub" x="960" y="574" text-anchor="end">Entorno · portabilidad</text>
</g>
</g>
<circle cx="500" cy="266" r="192" fill="none" stroke="#D77A00" stroke-width="16" opacity=".16"/>
<circle id="arqx-build-ring" class="build-ring" cx="500" cy="266" r="192" fill="none" stroke="#D77A00" stroke-width="3.5" pathLength="100" transform="rotate(-90 500 266)"/>
<circle cx="500" cy="266" r="178.8" fill="none" stroke="#D77A00" stroke-width="1" stroke-dasharray="3 7" opacity=".55"/>
<g class="orbit-dash" id="arqx-learning-orbit" aria-hidden="true"><circle cx="692" cy="266" r="7" fill="#D77A00" filter="url(#glow)"/><circle cx="500" cy="266" r="192" fill="none" stroke="#D77A00" stroke-width="10" stroke-linecap="round" stroke-dasharray="43.2 1206.37" opacity=".82" filter="url(#glow)"/><circle cx="500" cy="266" r="192" fill="none" stroke="#FFB547" stroke-width="3" stroke-linecap="round" stroke-dasharray="43.2 1206.37"/></g>
<g id="arqx-core">

<g transform="translate(500 266) scale(0.38544) translate(-768 -496)">
<path d="M 425,279 C 398,287 381,309 381,339 L 381,670 Q 381,711 416,733 L 728,921 Q 768,946 808,921 L 1121,734 Q 1156,713 1156,671 L 1156,332 Q 1156,308 1138,295 Q 1130,290 1124,306 L 1063,355 L 1063,649 Q 1063,676 1040,690 L 790,839 Q 768,852 746,839 L 495,690 Q 472,676 472,650 L 472,326 Z" fill="#091926"/>
<path d="M 541,352 L 738,234 Q 768,216 794,233 L 918,309 Q 923,313 914,319 L 857,357 Q 849,363 841,357 L 783,319 Q 768,309 752,319 L 627,394 Q 612,403 612,420 L 612,567 Q 612,582 627,591 L 751,663 Q 768,673 784,663 L 907,591 Q 922,582 922,566 L 922,458 Q 922,449 931,443 L 990,405 Q 999,399 999,410 L 999,592 Q 999,622 974,637 L 794,749 Q 768,765 742,749 L 559,638 Q 535,622 535,592 L 535,380 Q 535,362 541,352 Z" fill="#091926"/>
<path d="M 430,252 L 676,100 Q 767,47 858,99 L 1070,228 Q 1101,246 1100,278 Q 1099,302 1074,319 L 875,446 Q 861,454 861,469 L 861,534 Q 861,547 849,555 L 784,594 Q 768,603 752,594 L 687,555 Q 673,547 673,531 L 673,449 Q 673,438 685,430 L 749,390 Q 766,380 781,389 L 811,406 Q 820,412 829,406 L 990,303 Q 1003,293 991,280 L 847,191 Q 768,139 689,190 L 485,317 Q 476,323 472,333 Q 451,315 432,310 Q 399,293 430,252 Z" fill="#D77A00"/>
</g>
</g>
<g id="triad-lift-layer" aria-hidden="true" pointer-events="none">
<g class="triad-detail" data-triad="harness" transform="translate(250,360)" aria-hidden="true">
<g class="triad-inner">
<rect class="triad-frame" x="-215" y="-75" width="430" height="150" rx="24"/>
<g class="rail-icon" transform="translate(-183 0) scale(.5)" fill="none" stroke="#167A55" stroke-width="3"><rect x="-35" y="-21" width="70" height="57" rx="23" fill="#EAF2EF"/><path d="M0 -33 V-21 M-48 0 H-36 M36 0 H48"/><circle cx="-13" cy="3" r="5" fill="#167A55" stroke="none"/><circle cx="13" cy="3" r="5" fill="#167A55" stroke="none"/><path d="M-12 19 Q0 26 12 19"/></g>
<text class="triad-title" x="-146" y="-42">HARNESS · Continuidad</text>
<text class="triad-desc" x="-146" y="-16"><tspan x="-146" dy="0">Agentes de IA que ejecutan, orquestan</tspan><tspan x="-146" dy="28.5">y extienden el trabajo. El contexto</tspan><tspan x="-146" dy="28.5">sobrevive: no empiezas de cero.</tspan></text>
</g>
</g>
<g class="triad-detail" data-triad="arqx" transform="translate(500,350)" aria-hidden="true">
<g class="triad-inner">
<rect class="triad-frame" x="-215" y="-75" width="430" height="150" rx="24"/>
<path d="M-183 -12 L-172 -6 V6 L-183 12 L-194 6 V-6 Z" fill="none" stroke="#D77A00" stroke-width="2"/>
<text class="triad-title" x="-146" y="-42">ArqUX · Trazabilidad y evolución</text>
<text class="triad-desc" x="-146" y="-16"><tspan x="-146" dy="0">Seis dimensiones de gobierno: identidad,</tspan><tspan x="-146" dy="28.5">contrato, contexto, decisión, ejecución</tspan><tspan x="-146" dy="28.5">y evidencia. El aprendizaje se revisa.</tspan></text>
</g>
</g>
<g class="triad-detail" data-triad="project" transform="translate(750,360)" aria-hidden="true">
<g class="triad-inner">
<rect class="triad-frame" x="-215" y="-75" width="430" height="150" rx="24"/>
<g class="rail-icon" transform="translate(-183 0) scale(.5)" fill="none" stroke="#167A55" stroke-width="3"><path d="M0 -22 L29 -8 V18 L0 34 L-29 18 V-8 Z M0 -22 V6 M-29 -8 L0 6 L29 -8 M0 6 V34"/></g>
<text class="triad-title" x="-146" y="-42">PROYECTO · Portabilidad</text>
<text class="triad-desc" x="-146" y="-16"><tspan x="-146" dy="0">Tu entorno real: código, datos y</tspan><tspan x="-146" dy="28.5">resultados. El contexto puede viajar</tspan><tspan x="-146" dy="28.5">entre apps compatibles.</tspan></text>
</g>
</g>
</g>
<script><![CDATA[(function(){
  var base='/es/referencia/#dimensions';
  var R=document.currentScript?document.currentScript.closest('svg'):document.getElementById('arqx-map');
  var triadCards=Array.prototype.slice.call(R.querySelectorAll('.triad-detail'));
  function hideAll(){triadCards.forEach(function(c){c.classList.remove('is-on');});}
  function showTriad(g){hideAll();var k=g.getAttribute('data-triad');var c=R.querySelector('.triad-detail[data-triad="'+k+'"]');if(c)c.classList.add('is-on');}
  function go(t){if(!t)return;try{window.top.location.href=t;}catch(e){window.location.href=t;}}
  R.querySelectorAll('.triad-node').forEach(function(g){
    g.addEventListener('mouseenter',function(){showTriad(g);});g.addEventListener('mouseleave',hideAll);
    g.addEventListener('focus',function(){showTriad(g);});g.addEventListener('blur',hideAll);
    g.addEventListener('click',function(){go(g.getAttribute('data-target'));});
    g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go(g.getAttribute('data-target'));}});
  });

  var ring=R.querySelector('#arqx-learning-orbit');
  var build=R.querySelector('#arqx-build-ring');
  var core=R.querySelector('#arqx-core');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(ring&&build&&core&&!reduce){
    var LAP=2000,start=performance.now(),lastLap=null;
    var tick=function(now){
      var lap=Math.floor((now-start)/LAP);
      var ang=((now-start)%LAP)/LAP*360;
      ring.setAttribute('transform','rotate('+(ang-90).toFixed(2)+' 500 266)');
      if(lap%2===0){build.setAttribute('stroke-dasharray',(ang/3.6).toFixed(2)+' 100');build.setAttribute('stroke-dashoffset','0');}
      else{build.setAttribute('stroke-dasharray',((360-ang)/3.6).toFixed(2)+' 100');build.setAttribute('stroke-dashoffset',(-ang/3.6).toFixed(2));}
      if(lap!==lastLap){lastLap=lap;core.classList.remove('is-beat');void core.getBoundingClientRect();core.classList.add('is-beat');}
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
})();]]></script>
</svg>
